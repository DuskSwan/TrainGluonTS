[project]
name = "traingluonts"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.136.3",
    "gluonts[torch]>=0.16.2",
    "numpy>=2.1.3",
    "orjson>=3.11.9",
    "pydantic>=2.13.4",
    "pyinstaller>=6.20.0",
    "pyzmq>=27.1.0",
    "uvicorn>=0.49.0",
]

[project.optional-dependencies]
packaging = [
    "pyinstaller>=6",
]

[project.scripts]
traingluonts = "traingluonts.cli.main:main"
traingluonts-api = "traingluonts.api.server:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
